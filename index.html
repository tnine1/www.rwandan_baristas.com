<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rwandan Baristas Job Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<header>
  <h1>Rwandan Baristas Job Finder</h1>
  <nav>
    <a href="#" data-view="home">Home</a>
    <a href="#" data-view="login" id="loginLink">Login</a>
    <a href="#" data-view="register" id="registerLink">Register</a>
    <a href="#" data-view="dashboard" id="dashboardLink" class="hidden">Dashboard</a>
    <a href="#" id="logoutLink" class="hidden">Logout</a>
  </nav>
</header>

<main>
  <!-- Home -->
  <section id="home" class="view active">
    <p>Connect baristas in Rwanda with cafés and employers.</p>
    <div id="jobsList"></div>
  </section>

  <!-- Login -->
  <section id="login" class="view">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="login_email" placeholder="Email" required>
      <input type="password" id="login_password" placeholder="Password" required>
      <button>Login</button>
    </form>
    <div id="loginMsg"></div>
  </section>

  <!-- Register -->
  <section id="register" class="view">
    <h2>Register</h2>
    <form id="registerForm">
      <select id="role">
        <option value="barista">Barista</option>
        <option value="employer">Employer</option>
      </select>
      <input type="text" id="first_name" placeholder="First name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button>Create account</button>
    </form>
    <div id="registerMsg"></div>
  </section>

  <!-- Dashboard -->
  <section id="dashboard" class="view">
    <h2>Dashboard</h2>
    <p id="roleInfo"></p>

    <div id="baristaPanel" class="hidden">
      <h3>Barista Panel</h3>
      <textarea placeholder="Your skills"></textarea>
    </div>

    <div id="employerPanel" class="hidden">
      <h3>Employer Panel</h3>
      <input placeholder="Post a job title">
    </div>
  </section>
</main>

<footer>
  <small>&copy; Rwandan Baristas Job Finder</small>
</footer>

<script src="main.js"></script>
</body>
</html>
