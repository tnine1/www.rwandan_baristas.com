<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rwandan Baristas Job Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

<header>
  <h1>Rwandan Baristas Job Finder</h1>
  <nav>
    <a href="#" data-view="home">Home</a>
    <a href="#" data-view="login" id="loginLink">Login</a>
    <a href="#" data-view="register" id="registerLink">Register</a>
    <a href="#" data-view="dashboard" id="dashboardLink" class="hidden">Dashboard</a>
    <a href="#" id="logoutLink" class="hidden" onclick="logout()">Logout</a>
  </nav>
</header>

<main>

  <!-- HOME -->
  <section id="home" class="view active">
    <p>Connect baristas in Rwanda with cafés and employers.</p>
    <div id="jobs"></div>
  </section>

  <!-- LOGIN -->
  <section id="login" class="view">
    <h2>Login</h2>
    <form id="loginForm">
  <input type="email" name="email" placeholder="Email" required>
  <input type="password" name="password" placeholder="Password" required>
  <button type="submit">Login</button>
</form>

    <div id="loginMsg"></div>
  </section>


<!-- REGISTER -->
<section id="register" class="view">
  <h2>Register</h2>

  <form id="registerForm">
    <select id="role" name="role" required>
      <option value="barista">Barista</option>
      <option value="employer">Employer</option>
    </select>

    <input type="text" id="first_name" name="first_name" placeholder="First Name" required>
    <input type="text" id="last_name" name="last_name" placeholder="Last Name" required>
    <input type="email" id="email" name="email" placeholder="Email" required>
    <input type="password" id="password" name="password" placeholder="Password" required>
    <input type="text" id="phone" name="phone" placeholder="Phone">
    <input type="text" id="location" name="location" placeholder="Location">

    <button type="submit">Register</button>
  </form>

  <div id="registerMsg"></div>
</section>


  <!-- DASHBOARD -->
  <section id="dashboard" class="view">
    <h2>Dashboard</h2>
    <p id="roleInfo"></p>

    <!-- BARISTA -->
    <div id="baristaPanel" class="hidden">
      <h3>Barista Panel</h3>
      <textarea placeholder="Your skills"></textarea>
      <button>Save Profile</button>
    </div>

    <!-- EMPLOYER -->
    <div id="employerPanel" class="hidden">
      <h3>Employer Panel</h3>
      <input id="jobTitle" placeholder="Job title">
      <textarea id="jobDesc" placeholder="Job description"></textarea>
      <button>Post Job</button>

      <h4>Available Baristas</h4>
      <div id="baristas"></div>
    </div>
  </section>

</main>

<footer>
  <small>&copy; Rwandan Baristas Job Finder</small>
</footer>

<script src="main.js"></script>

<script>
/* =========================
   SIMPLE VIEW SWITCHER
========================= */
document.querySelectorAll("nav a[data-view]").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    const view = link.dataset.view;

    document.querySelectorAll(".view").forEach(v =>
      v.classList.remove("active")
    );

    document.getElementById(view).classList.add("active");
  });
});
</script>

</body>
</html>
